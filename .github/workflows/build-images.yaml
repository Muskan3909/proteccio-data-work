name: Publish Docker Images

# Disabled - Docker builds run locally successfully via docker compose
# Enable when GHCR registry setup is ready with proper build resources

on:
  # Disabled for now
  # push:
  #   branches:
  #     - 'main'
  # release:
  #   types: [published]
  workflow_dispatch: # Allow manual trigger if needed

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: frontend
            context: ./proteccio-frontend
            container_name: proteccio_frontend
          - name: backend
            context: ./proteccio-backend
            container_name: proteccio_backend
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v4

      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.container_name }}
          flavor: |
            latest=true     

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
